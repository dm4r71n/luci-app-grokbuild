# tmux settings for the Grok Build session.
# Used only by the grokbuild socket: tmux -f /etc/grokbuild/tmux.conf -L grokbuild

set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g status off
set -g set-titles off
set -g focus-events on
set -g allow-rename off

# Inner TERM. Fall back to screen-256color when tmux-256color has no terminfo.
if-shell 'test -e /usr/share/terminfo/t/tmux-256color' \
	'set -g default-terminal tmux-256color' \
	'set -g default-terminal screen-256color'

# Let grok (and tmux copy-mode) set the browser clipboard with OSC 52.
# xterm* already has the clipboard feature in tmux's defaults.
set -g set-clipboard on

# ttyd reports xterm-256color and xterm.js understands truecolor.
set -as terminal-features ',xterm-256color:RGB'

# The session should outlive its last client.
set -g destroy-unattached off
set -g exit-empty off
