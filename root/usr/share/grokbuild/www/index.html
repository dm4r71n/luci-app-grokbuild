/**
 *  Default styles for xterm.js
 */

.xterm {
    cursor: text;
    position: relative;
    user-select: none;
    -ms-user-select: none;
    -webkit-user-select: none;
}

.xterm.focus,
.xterm:focus {
    outline: none;
}

.xterm .xterm-helpers {
    position: absolute;
    top: 0;
    /**
     * The z-index of the helpers must be higher than the canvases in order for
     * IMEs to appear on top.
     */
    z-index: 5;
}

.xterm .xterm-helper-textarea {
    padding: 0;
    border: 0;
    margin: 0;
    /* Move textarea out of the screen to the far left, so that the cursor is not visible */
    position: absolute;
    opacity: 0;
    left: -9999em;
    top: 0;
    width: 0;
    height: 0;
    z-index: -5;
    /** Prevent wrapping so the IME appears against the textarea at the correct position */
    white-space: nowrap;
    overflow: hidden;
    resize: none;
}

.xterm .composition-view {
    /* TODO: Composition position got messed up somewhere */
    background: #000;
    color: #FFF;
    display: none;
    position: absolute;
    white-space: nowrap;
    z-index: 1;
}

.xterm .composition-view.active {
    display: block;
}

.xterm .xterm-viewport {
    /* On OS X this is required in order for the scroll bar to appear fully opaque */
    background-color: #000;
    overflow-y: scroll;
    cursor: default;
    position: absolute;
    right: 0;
    left: 0;
    top: 0;
    bottom: 0;
}

.xterm .xterm-screen {
    position: relative;
}

.xterm .xterm-screen canvas {
    position: absolute;
    left: 0;
    top: 0;
}

.xterm .xterm-scroll-area {
    visibility: hidden;
}

.xterm-char-measure-element {
    display: inline-block;
    visibility: hidden;
    position: absolute;
    top: 0;
    left: -9999em;
    line-height: normal;
}

.xterm.enable-mouse-events {
    /* When mouse events are enabled (eg. tmux), revert to the standard pointer cursor */
    cursor: default;
}

.xterm.xterm-cursor-pointer,
.xterm .xterm-cursor-pointer {
    cursor: pointer;
}

.xterm.column-select.focus {
    /* Column selection mode */
    cursor: crosshair;
}

.xterm .xterm-accessibility:not(.debug),
.xterm .xterm-message {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    right: 0;
    z-index: 10;
    color: transparent;
    pointer-events: none;
}

.xterm .xterm-accessibility-tree:not(.debug) *::selection {
  color: transparent;
}

.xterm .xterm-accessibility-tree {
  user-select: text;
  white-space: pre;
}

.xterm .live-region {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
}

.xterm-dim {
    /* Dim should not apply to background, so the opacity of the foreground color is applied
     * explicitly in the generated class and reset to 1 here */
    opacity: 1 !important;
}

.xterm-underline-1 { text-decoration: underline; }
.xterm-underline-2 { text-decoration: double underline; }
.xterm-underline-3 { text-decoration: wavy underline; }
.xterm-underline-4 { text-decoration: dotted underline; }
.xterm-underline-5 { text-decoration: dashed underline; }

.xterm-overline {
    text-decoration: overline;
}

.xterm-overline.xterm-underline-1 { text-decoration: overline underline; }
.xterm-overline.xterm-underline-2 { text-decoration: overline double underline; }
.xterm-overline.xterm-underline-3 { text-decoration: overline wavy underline; }
.xterm-overline.xterm-underline-4 { text-decoration: overline dotted underline; }
.xterm-overline.xterm-underline-5 { text-decoration: overline dashed underline; }

.xterm-strikethrough {
    text-decoration: line-through;
}

.xterm-screen .xterm-decoration-container .xterm-decoration {
	z-index: 6;
	position: absolute;
}

.xterm-screen .xterm-decoration-container .xterm-decoration.xterm-decoration-top-layer {
	z-index: 7;
}

.xterm-decoration-overview-ruler {
    z-index: 8;
    position: absolute;
    top: 0;
    right: 0;
    pointer-events: none;
}

.xterm-decoration-top {
    z-index: 2;
    position: relative;
}
:root {
	--bg: #05070e;
	--surface: #141822;
	--overlay: #181d27;
	--sunken: #0a0e17;
	--text: #f9fafb;
	--muted: #909297;
	--hairline: #f9fafb1a;
	--brand: #00958e;
	--brand-hover: #00837d;
	--danger: #f17070;
	--success: #51bd85;
	--warn: #e5c07b;
	--bar-h: 48px;
	color-scheme: dark;
}
html, body {
	margin: 0;
	height: 100%;
	overflow: hidden;
	background: var(--sunken);
	color: var(--text);
	overscroll-behavior: none;
	-webkit-text-size-adjust: 100%;
	font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
#app {
	position: fixed;
	left: 0;
	top: 0;
	width: 100%;
	height: 100vh;
	height: 100dvh;
	height: var(--app-h, 100dvh);
	display: flex;
	flex-direction: column;
	padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
	box-sizing: border-box;
}
#term {
	flex: 1 1 auto;
	min-height: 0;
	overflow: hidden;
	padding: 2px 0 0 4px;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
}
#term .xterm { height: 100%; }
#term .xterm-viewport { overflow-y: hidden !important; background: var(--sunken) !important; }

/* key bar */
#bar {
	display: none;
	flex: 0 0 auto;
	gap: 6px;
	padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
	overflow-x: auto;
	overflow-y: hidden;
	scrollbar-width: none;
	background: var(--surface);
	border-top: 1px solid var(--hairline);
	touch-action: pan-x;
	-webkit-overflow-scrolling: touch;
}
#bar::-webkit-scrollbar { display: none; }
html.keys #bar { display: flex; }
html.keys.bar-hidden #bar { display: none; }
#bar button, #show-bar, .sheet-actions button {
	flex: 0 0 auto;
	min-width: 46px;
	height: 42px;
	padding: 0 10px;
	border: 1px solid var(--hairline);
	border-radius: 8px;
	background: var(--overlay);
	color: var(--text);
	font: 600 14px/1 system-ui, -apple-system, Roboto, sans-serif;
	touch-action: manipulation;
	-webkit-tap-highlight-color: transparent;
	-webkit-user-select: none;
	user-select: none;
}
#bar button:active, #show-bar:active { background: var(--brand-hover); }
#bar button.on { background: var(--brand); border-color: var(--brand); }
#bar button.lock { background: var(--brand); border-color: var(--text); box-shadow: inset 0 -3px 0 var(--text); }
#bar .sep { flex: 0 0 1px; background: var(--hairline); margin: 4px 2px; }
#bar .wide { min-width: 58px; }

#show-bar {
	display: none;
	position: absolute;
	right: 10px;
	bottom: calc(10px + env(safe-area-inset-bottom));
	opacity: .85;
	z-index: 5;
}
html.keys.bar-hidden #show-bar { display: block; }

/* status pill */
.pill {
	position: absolute;
	top: calc(6px + env(safe-area-inset-top));
	right: 8px;
	z-index: 6;
	padding: 4px 10px;
	border-radius: 999px;
	font: 600 12px/1.4 system-ui, -apple-system, Roboto, sans-serif;
	background: var(--overlay);
	border: 1px solid var(--hairline);
	color: var(--text);
	box-shadow: 0 2px 8px #0008;
	cursor: pointer;
}
.pill::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--muted); }
.pill.open::before { background: var(--success); }
.pill.connecting::before { background: var(--warn); }
.pill.retry::before, .pill.auth::before { background: var(--danger); }
[hidden] { display: none !important; }

#toast {
	position: absolute;
	left: 50%;
	bottom: calc(var(--bar-h) + 24px);
	transform: translateX(-50%);
	z-index: 7;
	max-width: 90%;
	padding: 10px 16px;
	border-radius: 10px;
	background: var(--overlay);
	border: 1px solid var(--brand);
	color: var(--text);
	font: 600 14px/1.3 system-ui, -apple-system, Roboto, sans-serif;
	box-shadow: 0 4px 16px #000a;
}

/* copy sheet */
#sheet {
	position: absolute;
	inset: 0;
	z-index: 8;
	display: flex;
	flex-direction: column;
	gap: 8px;
	padding: calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
	background: #05070ef2;
}
#sheet-text {
	flex: 1;
	min-height: 0;
	resize: none;
	padding: 8px;
	border: 1px solid var(--hairline);
	border-radius: 8px;
	background: var(--sunken);
	color: var(--text);
	font: 12px/1.35 "JetBrains Mono", "DejaVu Sans Mono", "Roboto Mono", ui-monospace, monospace;
	white-space: pre;
	overflow: auto;
	-webkit-user-select: text;
	user-select: text;
}
.sheet-actions { display: flex; gap: 8px; justify-content: flex-end; }
.sheet-actions .primary { background: var(--brand); border-color: var(--brand); }
.sheet-hint { color: var(--muted); font-size: 12px; margin-right: auto; align-self: center; }
</style>

<body>
<div id="app">
	<div id="term"></div>
	<div id="bar" role="toolbar" aria-label="Keys">
		<button data-k="kbd" aria-label="Show or hide keyboard">⌨</button>
		<button data-k="esc">Esc</button>
		<button data-k="tab">Tab</button>
		<button data-k="stab" class="wide">⇧Tab</button>
		<button data-k="ctrl">Ctrl</button>
		<button data-k="alt">Alt</button>
		<span class="sep"></span>
		<button data-k="left" aria-label="Left">←</button>
		<button data-k="up" aria-label="Up">↑</button>
		<button data-k="down" aria-label="Down">↓</button>
		<button data-k="right" aria-label="Right">→</button>
		<button data-k="enter" aria-label="Enter">⏎</button>
		<span class="sep"></span>
		<button data-k="pgup" class="wide">PgUp</button>
		<button data-k="pgdn" class="wide">PgDn</button>
		<button data-k="home" class="wide">Home</button>
		<button data-k="end">End</button>
		<span class="sep"></span>
		<button data-k="font-" aria-label="Smaller text">A−</button>
		<button data-k="font+" aria-label="Larger text">A+</button>
		<button data-k="copy" class="wide">Copy</button>
		<button data-k="paste" class="wide">Paste</button>
		<button data-k="hide" aria-label="Hide key bar">▾</button>
	</div>
	<button id="show-bar" aria-label="Show key bar">⌨ ▴</button>
	<div id="pill" class="pill" hidden></div>
	<div id="toast" hidden></div>
	<div id="sheet" hidden>
		<textarea id="sheet-text" readonly spellcheck="false" aria-label="Screen text"></textarea>
		<div class="sheet-actions">
			<span class="sheet-hint">Long-press to select.</span>
			<button id="sheet-close">Close</button>
			<button id="sheet-copy" class="primary">Copy</button>
		</div>
	</div>
</div>
